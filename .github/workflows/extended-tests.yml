# Extended tests in Code/DHARMaTests, which are not part of R CMD check
# Runs only when triggered manually via the 'Run workflow' button in the Actions tab (a branch can be selected there).
on:
  workflow_dispatch:

name: Extended tests

permissions: read-all

jobs:
  extended-tests:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::BH
            StanHeaders@2.32.10
            any::RcppEigen
            local::.
          working-directory: DHARMa

      - name: Run extended tests
        run: |
          library(DHARMa)
          testthat::test_dir("Code/DHARMaTests", stop_on_failure = TRUE)
        shell: Rscript {0}
